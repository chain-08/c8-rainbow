version: '3.8'

services:
  c8dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: c8dbeaver
    ports:
      - "8980:8978"   
    environment:
      - CB_SERVER_NAME=DBeaver
      - CB_SERVER_PORT=8978
      - CB_ADMIN_NAME=admin
      - CB_ADMIN_PASSWORD=admin
    networks:
      - c8_crons
    restart: always

networks:
  c8_crons:
    external: true
